name: Colab 桌宠与总控端可靠性、安全与打包 CI 验证

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_gui_regression:
        description: "是否额外运行 @pytest.mark.gui 桌面视觉回归（仅适用于具备交互式 Windows 桌面与 WebView2 的自托管 Runner）"
        required: false
        default: false
        type: boolean

jobs:
  offline-reliability-security-and-packaging:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.12 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements-lock.txt
            requirements-dev.txt

      - name: 安装锁定运行依赖与离线测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "requirements-lock.txt" -r "requirements-dev.txt"
          python -m pip check

      - name: 全量源码语法编译检查
        run: |
          python -c "import pathlib, py_compile; skip = {'.git', 'dist', 'dist_ci', 'build', '_pyinstaller_work'}; files = [p for p in sorted(pathlib.Path('.').rglob('*.py')) if not any(part in skip for part in p.parts)]; [py_compile.compile(str(f), doraise=True) for f in files]; print('ALL_PY_COMPILE_OK', len(files))"

      - name: 运行 Ruff 静态代码质量与复杂度门禁检查
        run: |
          python -m ruff check --config "ruff.toml" .

      - name: 校验技术栈版本清单与桥接节点一致性
        run: |
          python -c "import sys; sys.path.insert(0, '.'); from colab_core.health import verify_manifest_and_assets; r = verify_manifest_and_assets(); assert r['ok'], r; print('MANIFEST_OK', r)"

      - name: 运行核心运维安全回归必跑集（双服务冷启动、停卡绑定、凭据同源、下载恢复）
        shell: pwsh
        run: |
          $coreRegressionTests = @(
            # 1) 双服务冷启动、公网双向鉴权与停卡绑定安全闸门
            "tests/test_security_gates_and_stop.py",
            # 2) 多号算力池停卡绑定与分槽防误停
            "tests/test_pool_and_cluster.py::test_cluster_lost_slot_binding_never_autoclaims_and_stop_calls_zero",
            "tests/test_pool_and_cluster.py::test_split_cluster_deploy_selective_stop_and_cross_account_seams",
            "tests/test_reliability_and_security.py::test_dual_session_recreate_and_stop_isolation",
            "tests/test_reliability_and_security.py::test_stop_failure_and_unreleased_verification",
            "tests/test_reliability_and_security.py::test_cmd_run_auto_stop_never_swallows_failure",
            "tests/test_reliability_and_security.py::test_stop_chain_timeouts_never_hang_or_swallow",
            # 3) 凭据同源硬绑定与跨源重定向防泄露
            "tests/test_reliability_and_security.py::test_vault_migration_redaction_and_comfy_auth_gateway",
            "tests/test_reliability_and_security.py::test_comfy_probe_cross_origin_redirect_never_leaks_key",
            "tests/test_reliability_and_security.py::test_comfy_first_request_url_mismatch_never_attaches_wrong_key",
            "tests/test_agent_copilot.py::test_security_vault_isolation_zero_leak_and_code_guardrails",
            "tests/test_agent_copilot.py::test_provider_origin_change_invalidates_old_key_and_vault_origin_pinning",
            "tests/test_agent_copilot.py::test_agent_cross_origin_redirect_never_leaks_credentials",
            # 4) Comfy 作品自动下载失败恢复与重启持久化
            "tests/test_reliability_and_security.py::test_comfy_auto_pull_all_failed_never_claims_saved_and_keeps_pending",
            "tests/test_reliability_and_security.py::test_comfy_partial_pull_and_incremental_retry_convergence",
            "tests/test_reliability_and_security.py::test_comfy_pending_dedup_and_monkeypatch_download_compat",
            "tests/test_reliability_and_security.py::test_comfy_download_mkdir_failure_still_persists_pending_and_recovers",
            "tests/test_reliability_and_security.py::test_comfy_pending_pull_survives_backend_restart",
            "tests/test_reliability_and_security.py::test_comfy_concurrent_pull_deduplicated_via_pull_lock",
            "tests/test_reliability_and_security.py::test_comfy_download_validates_complete_200_body_and_large_queue_survives_restart"
          )
          python -m pytest -v -c "pytest.ini" @coreRegressionTests

      - name: 运行全量离线非 GUI 测试套件（覆盖全部测试文件）
        run: |
          python -m pytest -v -c "pytest.ini" -m "not gui" "tests"

      - name: 核验 GUI 视觉回归用例清单与桌面复现指引
        shell: pwsh
        run: |
          python -m pytest -c "pytest.ini" -m "gui" --collect-only -q "tests"
          Write-Host "提示：@pytest.mark.gui 标记的真实 PyWebView/WebView2 双窗视觉回归测试依赖交互式 Windows 桌面环境，无头托管 CI 默认跳过。"
          Write-Host "在具备 Windows 桌面与 Edge WebView2 运行时的本机或自托管 Runner 上，请运行："
          Write-Host '  python -m pytest -v -c "pytest.ini" -m "gui" "tests"'

      - name: 可选运行 Windows 桌面 GUI 视觉回归（需交互式桌面环境）
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_gui_regression == true }}
        run: |
          python -m pytest -v -c "pytest.ini" -m "gui" "tests"

      - name: 验证 Windows 便携发行包编译与 EXE 启动器自检
        run: |
          python "build_windows_package.py" --mode portable --out-dir dist_ci
          python -c "import subprocess; r = subprocess.run([r'.\dist_ci\Colab桌宠\Colab桌宠.exe', '--self-test'], capture_output=True, text=True, check=True); assert 'COLAB_PET_LAUNCHER_SELF_TEST_OK:1' in r.stdout, r.stdout; print(r.stdout.strip())"
