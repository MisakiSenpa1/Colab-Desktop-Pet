# Pytest 测试配置文件 —— Colab 桌宠与总控端
# 用法示例：
#   1) CI / 无头环境离线测试：python -m pytest -v -c "pytest.ini" -m "not gui" "tests"
#   2) Windows 桌面环境 GUI 视觉回归：python -m pytest -v -c "pytest.ini" -m "gui" "tests"

[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = --strict-markers
markers =
    gui: 需要真实 Windows 桌面 WebView2 / PyWebView 窗口渲染与视觉截图的测试用例
    regression: 核心运维安全回归必跑集（双服务冷启动、停卡绑定、凭据同源、下载恢复等）
